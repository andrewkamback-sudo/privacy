<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>document.documentElement.classList.add('js');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} - FlowState Logic</title>
  <meta name="description" content="{{ page.title }} for FlowState Logic, a Cinderway Interactive project.">
  <meta name="theme-color" content="#1B1B1E">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/legal.css">

  <!-- Analytics - cookieless, no consent banner needed. See flowstate-logic/index.html
       for swap notes if you use a different provider. -->
  <script defer data-domain="cinderwayinteractive.com" src="https://plausible.io/js/script.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="site-shell">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand-mark" href="/" aria-label="Cinderway Interactive home">
          <img class="brand-logo" src="/assets/svg/cinderway-logo.png" alt="" width="64" height="64">
          <img class="brand-wordmark" src="/assets/svg/cinderway-wordmark.png" alt="Cinderway Interactive">
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation menu" data-nav-toggle>
          <span class="nav-toggle-icon" aria-hidden="true"></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Primary" data-site-nav>
          <ul>
            <li><a href="/#projects">Projects</a></li>
            <li><a href="/flowstate-logic/">FlowState Logic</a></li>
            <li><a href="/privacy.html">Legal</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="container breadcrumb">
      <a href="/">Cinderway Interactive</a>
      <span class="breadcrumb-sep">/</span>
      <a href="/flowstate-logic/">FlowState Logic</a>
      <span class="breadcrumb-sep">/</span>
      <a href="/flowstate-logic/patch-notes/">Patch notes</a>
      {% if page.title %}
        <span class="breadcrumb-sep">/</span>
        <span aria-current="page">{{ page.title }}</span>
      {% endif %}
    </div>

    <main id="main" class="doc-main">
      <article class="doc">
        <p class="doc-eyebrow">Patch notes</p>
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span class="footer-brand">
          <img src="/assets/svg/cinderway-logo.png" alt="" width="32" height="32">
          FlowState Logic · a Cinderway Interactive project
        </span>
        <nav class="footer-nav" aria-label="Legal">
          <a href="/privacy.html">Privacy</a>
          <a href="/terms.html">Terms</a>
          <a href="/delete-account.html">Delete account</a>
        </nav>
      </div>
    </footer>
  </div>
  <script src="/js/cinderway.js" defer></script>
</body>
</html>
