<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — FlowState Logic</title>
  <style>
    :root {
      --bg: #0d0800;
      --surface: #1a1208;
      --text: #f5e6d3;
      --muted: #9a8771;
      --accent: #ff5722;
      --border: #3a2a18;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    .breadcrumb {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 24px 0;
      font-size: 13px;
      color: var(--muted);
    }
    .breadcrumb a {
      color: var(--muted);
      text-decoration: none;
    }
    .breadcrumb a:hover {
      color: var(--accent);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 24px 96px;
    }
    h1 {
      font-size: 32px;
      margin: 0 0 8px;
      color: var(--accent);
    }
    h2 {
      font-size: 22px;
      margin: 40px 0 12px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    h3 {
      font-size: 17px;
      margin: 24px 0 8px;
      color: var(--text);
    }
    p, li {
      color: var(--text);
      font-size: 15px;
    }
    ul, ol {
      padding-left: 24px;
    }
    li {
      margin-bottom: 6px;
    }
    code {
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      color: var(--accent);
    }
    a {
      color: var(--accent);
    }
    a:hover {
      text-decoration: none;
    }
    em {
      color: var(--muted);
    }
    strong {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="breadcrumb">
    <a href="/">← Cinderway Interactive</a>
    &nbsp;/&nbsp;
    <a href="/flowstate-logic/">FlowState Logic</a>
  </div>
  <main>
    {{ content }}
  </main>
</body>
</html>
