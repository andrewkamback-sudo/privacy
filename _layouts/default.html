<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="/js/init.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} - FlowState Logic</title>
  <meta name="description" content="{{ page.title }} for FlowState Logic, a Cinderway Interactive project.">
  <meta name="theme-color" content="#1B1B1E">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.title }} for FlowState Logic, a Cinderway Interactive project.">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="Cinderway Interactive">
  <meta property="og:image" content="{{ '/assets/icons/icon-512.png' | absolute_url }}">
  <meta property="og:image:alt" content="FlowState Logic app icon">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.title }} for FlowState Logic.">
  <meta name="twitter:image" content="{{ '/assets/icons/icon-512.png' | absolute_url }}">

  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/legal.css">

  <!-- Analytics - cookieless, no consent banner needed. See flowstate-logic/index.html
       for swap notes if you use a different provider. -->
  <script defer data-domain="cinderwayinteractive.com" src="https://plausible.io/js/script.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="site-shell">
    {% include site-header.html current='flowstate' %}

    <div class="container breadcrumb">
      <a href="/">Cinderway Interactive</a>
      <span class="breadcrumb-sep">/</span>
      <a href="/flowstate-logic/">FlowState Logic</a>
      <span class="breadcrumb-sep">/</span>
      <a href="/flowstate-logic/patch-notes/">Patch notes</a>
      {% if page.title %}
        <span class="breadcrumb-sep">/</span>
        <span aria-current="page">{{ page.title }}</span>
      {% endif %}
    </div>

    <main id="main" class="doc-main">
      <article class="doc">
        <p class="doc-eyebrow">Patch notes</p>
        {{ content }}
      </article>
    </main>

    {% include site-footer.html context='flowstate' %}
  </div>
  <script src="/js/site.js" defer></script>
</body>
</html>
