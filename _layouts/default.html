<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — FlowState Logic</title>
  <meta name="description" content="{{ page.title }} for FlowState Logic, a Cinderway Interactive project.">
  <meta name="theme-color" content="#1B1B1E">

  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/legal.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="site-shell">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand-mark" href="/" aria-label="Cinderway Interactive home">
          <img src="/assets/svg/logo-icon.svg" alt="" width="44" height="44">
          <span class="brand-text">
            <span class="brand-name">Cinderway</span>
            <span class="brand-subtitle">Interactive</span>
          </span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          <ul>
            <li><a href="/#projects">Projects</a></li>
            <li><a href="/flowstate-logic/">FlowState Logic</a></li>
            <li><a href="/privacy.html">Legal</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="container breadcrumb">
      <a href="/">Cinderway Interactive</a>
      <span class="breadcrumb-sep">/</span>
      <a href="/flowstate-logic/">FlowState Logic</a>
      <span class="breadcrumb-sep">/</span>
      <a href="/flowstate-logic/patch-notes/">Patch notes</a>
      {% if page.title %}
        <span class="breadcrumb-sep">/</span>
        <span aria-current="page">{{ page.title }}</span>
      {% endif %}
    </div>

    <main id="main" class="doc-main">
      <article class="doc">
        <p class="doc-eyebrow">Patch notes</p>
        {{ content }}
      </article>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span class="footer-brand">
          <img src="/assets/svg/logo-icon.svg" alt="" width="32" height="32">
          FlowState Logic · a Cinderway Interactive project
        </span>
        <nav class="footer-nav" aria-label="Legal">
          <a href="/privacy.html">Privacy</a>
          <a href="/terms.html">Terms</a>
          <a href="/delete-account.html">Delete account</a>
        </nav>
      </div>
    </footer>
  </div>
</body>
</html>
