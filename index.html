<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinderway Interactive</title>
  <meta name="description" content="Indie studio building pixel-art experiences. Currently shipping FlowState Logic.">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #15151f;
      --text: #e8e8f0;
      --muted: #8a8a99;
      --accent: #b8a4ff;
      --border: #2a2a3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 96px 24px 32px;
      text-align: center;
      flex: 1;
    }
    h1 {
      font-size: 44px;
      margin: 0 0 12px;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .tagline {
      color: var(--muted);
      font-size: 17px;
      margin: 0 0 64px;
    }
    .section-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 20px;
    }
    .projects {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 64px;
    }
    @media (max-width: 560px) {
      .projects { grid-template-columns: 1fr; }
    }
    .project {
      display: block;
      padding: 28px 24px;
      border: 2px solid var(--border);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, transform 0.15s;
      background: var(--surface);
    }
    .project:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .project.placeholder {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .project.placeholder:hover {
      border-color: var(--border);
      transform: none;
    }
    .project-title {
      font-size: 20px;
      margin: 0 0 6px;
      color: var(--accent);
    }
    .project.placeholder .project-title {
      color: var(--muted);
    }
    .project-blurb {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }
    .status-pill {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      margin-left: 8px;
      vertical-align: middle;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .status-pill.live {
      color: var(--accent);
      border-color: var(--accent);
    }
    footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a {
      color: var(--muted);
      margin: 0 8px;
    }
    footer a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Cinderway Interactive</h1>
    <p class="tagline">An indie studio building pixel-art experiences.</p>

    <p class="section-label">Projects</p>
    <div class="projects">
      <a class="project" href="flowstate-logic/">
        <p class="project-title">FlowState Logic <span class="status-pill live">Alpha</span></p>
        <p class="project-blurb">Pixel-art programming lessons that fit in your pocket.</p>
      </a>
      <a class="project placeholder" href="#" onclick="event.preventDefault();">
        <p class="project-title">Future Projects <span class="status-pill">Soon</span></p>
        <p class="project-blurb">More in the kiln. Stay tuned.</p>
      </a>
    </div>
  </main>
  <footer>
    © Cinderway Interactive ·
    <a href="privacy.html">Privacy</a> ·
    <a href="terms.html">Terms</a> ·
    <a href="delete-account.html">Delete account</a>
  </footer>
</body>
</html>
