<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Cinderway pixel ember website hero banner</title>
  <desc id="desc">A dark pixel-art mountain path with campfire embers and a distant castle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#141418"/>
      <stop offset="0.55" stop-color="#2B222C"/>
      <stop offset="1" stop-color="#0F1113"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <rect y="0" width="1600" height="700" fill="#1B1B1E" opacity="0.18"/>
  <!-- Pixel stars -->
  <rect x="180" y="94" width="8" height="8" fill="#F4EDE1" opacity=".35"/>
  <rect x="1224" y="130" width="8" height="8" fill="#F26822" opacity=".65"/>
  <rect x="1080" y="88" width="6" height="6" fill="#FFC25A" opacity=".5"/>
  <rect x="1390" y="230" width="10" height="10" fill="#B03A2E" opacity=".55"/>
  <!-- Mountains -->
  <polygon points="0,500 180,305 320,455 520,245 780,530" fill="#24242B"/>
  <polygon points="380,545 670,285 920,555" fill="#2F2F36"/>
  <polygon points="820,540 1050,250 1280,540" fill="#34313A"/>
  <polygon points="1160,560 1380,325 1600,555" fill="#2A2A31"/>
  <polygon points="510,262 548,320 475,310" fill="#4F4C55" opacity=".6"/>
  <polygon points="1048,253 1088,324 1002,314" fill="#5A5862" opacity=".5"/>
  <!-- Distant castle -->
  <rect x="1240" y="285" width="46" height="170" fill="#15161A"/>
  <rect x="1300" y="245" width="56" height="210" fill="#15161A"/>
  <rect x="1370" y="305" width="40" height="150" fill="#15161A"/>
  <polygon points="1240,285 1263,240 1286,285" fill="#1E2026"/>
  <polygon points="1300,245 1328,185 1356,245" fill="#1E2026"/>
  <polygon points="1370,305 1390,260 1410,305" fill="#1E2026"/>
  <rect x="1324" y="322" width="8" height="18" fill="#F26822" opacity=".8"/>
  <rect x="1260" y="360" width="8" height="18" fill="#FFC25A" opacity=".6"/>
  <!-- Ground / path -->
  <polygon points="0,700 0,610 440,565 670,590 900,545 1600,600 1600,700" fill="#111216"/>
  <polygon points="555,700 750,590 980,545 1055,570 815,700" fill="#2D201D"/>
  <polygon points="665,700 755,620 910,585 832,700" fill="#533029"/>
  <!-- Campfire -->
  <rect x="890" y="540" width="96" height="16" fill="#1A1A1E"/>
  <rect x="922" y="492" width="28" height="50" fill="#F26822"/>
  <rect x="914" y="520" width="50" height="30" fill="#B03A2E"/>
  <rect x="932" y="510" width="20" height="32" fill="#FFC25A"/>
  <rect x="940" y="524" width="10" height="16" fill="#F4EDE1"/>
  <rect x="910" y="472" width="8" height="8" fill="#F26822"/>
  <rect x="970" y="462" width="8" height="8" fill="#FFC25A"/>
  <rect x="996" y="500" width="8" height="8" fill="#B03A2E"/>
  <!-- Character silhouette -->
  <rect x="800" y="500" width="24" height="48" fill="#0B0B0D"/>
  <rect x="808" y="480" width="16" height="16" fill="#0B0B0D"/>
  <rect x="824" y="512" width="16" height="10" fill="#0B0B0D"/>
  <rect x="792" y="548" width="14" height="48" fill="#0B0B0D"/>
  <rect x="824" y="548" width="14" height="48" fill="#0B0B0D"/>
  <!-- CTA safe dark overlay left -->
  <rect x="70" y="90" width="730" height="440" fill="#0B0B0D" opacity=".66"/>
  <rect x="70" y="90" width="6" height="440" fill="#F26822"/>
